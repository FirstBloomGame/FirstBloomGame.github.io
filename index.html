<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Bloom</title>
<meta name="description" content="First Bloom: an idle evolution game. Start from a few molecules in an empty ocean and grow life, one creature at a time.">
<style>
  :root {
    --bg: #f7f5ef;
    --text: #1d2140;
    --soft: #545a80;
    --accent: #b97a00;
    --link: #3446b8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12142b;
      --text: #eef0ff;
      --soft: #aab0d8;
      --accent: #ffc53d;
      --link: #9fb0ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12142b;
    --text: #eef0ff;
    --soft: #aab0d8;
    --accent: #ffc53d;
    --link: #9fb0ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  main { max-width: 560px; padding: 48px 16px; }
  h1 { font-size: 2.6rem; line-height: 1.1; margin: 0 0 12px; color: var(--accent); }
  p { margin: 0 0 24px; color: var(--soft); }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>First Bloom</h1>
  <p>An idle evolution game. Start from a few molecules in an empty ocean and grow life, one creature at a time.</p>
  <p><a href="privacy-policy.html">Privacy policy</a></p>
</main>
</body>
</html>
