<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Bloom</title>
<meta name="description" content="First Bloom: an idle evolution game. Start from a few molecules in an empty ocean and grow life, one creature at a time.">
<meta name="theme-color" content="#0b1a33">
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  /* Fredoka is stored on this site (no third-party font service). License: fonts/OFL.txt */
  @font-face {
    font-family: "Fredoka";
    src: url("fonts/Fredoka.woff2") format("woff2");
    font-weight: 300 700;
    font-display: swap;
  }
  :root {
    --deep: #0b1a33;
    --glow: #1d6f8f;
    --text: #ffffff;
    --soft: rgba(255, 255, 255, 0.72);
    --faint: rgba(255, 255, 255, 0.45);
    --tray: rgba(3, 6, 22, 0.32);
    --gold: #ffc23d;
    --gold-lip: #c98a12;
    --green: #5fd068;
    --pink: #ff7eb3;
    --cyan: #7fe3ff;
  }
  * { box-sizing: border-box; }
  html { background: var(--deep); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-family: "Fredoka", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
    background:
      radial-gradient(ellipse 70% 55% at 50% 32%, rgba(127, 227, 255, 0.16), transparent 70%),
      radial-gradient(ellipse 120% 90% at 50% 30%, var(--glow) 0%, #123a5e 40%, var(--deep) 78%);
    background-attachment: fixed;
    overflow-x: hidden;
  }

  /* Drifting motes, like the ones in the game's ocean. */
  .motes { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .motes span {
    position: absolute;
    bottom: -20px;
    width: var(--s, 8px);
    height: var(--s, 8px);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.9), rgba(200, 250, 255, 0.25) 60%, transparent 72%);
    opacity: 0.55;
    animation: rise var(--t, 16s) linear var(--d, 0s) infinite;
  }
  @keyframes rise {
    from { transform: translate(0, 0); }
    50% { transform: translate(18px, -55vh); }
    to { transform: translate(-6px, -115vh); }
  }

  main {
    position: relative;
    width: 100%;
    max-width: 520px;
    padding: 56px 16px 32px;
  }
  .icon {
    display: block;
    width: 152px;
    height: 152px;
    margin: 0 auto 28px;
    border-radius: 36px;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.12),
      0 18px 40px rgba(0, 0, 10, 0.45),
      0 0 70px rgba(127, 227, 255, 0.25);
    animation: bob 5s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }
  h1 {
    margin: 0;
    font-size: clamp(2.8rem, 12vw, 4rem);
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.01em;
    text-shadow: 0 3px 0 rgba(0, 0, 20, 0.35), 0 8px 24px rgba(0, 0, 20, 0.35);
  }
  .tagline {
    margin: 16px auto 0;
    max-width: 400px;
    font-size: 1.2rem;
    line-height: 1.45;
    color: var(--soft);
    text-shadow: 0 1px 6px rgba(0, 0, 20, 0.4);
  }
  .soon {
    display: inline-block;
    margin-top: 26px;
    padding: 12px 26px 14px;
    border-radius: 999px;
    background: var(--gold);
    box-shadow: inset 0 -5px 0 var(--gold-lip), 0 8px 20px rgba(0, 0, 10, 0.3);
    color: #3d2600;
    font-size: 1.1rem;
    font-weight: 600;
  }

  footer {
    position: relative;
    padding: 8px 16px 40px;
    font-size: 0.95rem;
    color: var(--faint);
  }
  footer nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 22px; margin-bottom: 10px; }
  footer a { color: var(--soft); text-decoration: none; border-bottom: 1px solid rgba(255, 255, 255, 0.25); }
  footer a:hover, footer a:focus-visible { color: var(--text); border-color: var(--text); }
  footer p { margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .motes { display: none; }
    .icon { animation: none; }
  }
</style>
</head>
<body>
<div class="motes" aria-hidden="true">
  <span style="left:8%;--s:7px;--t:19s;--d:-3s"></span>
  <span style="left:21%;--s:12px;--t:24s;--d:-14s"></span>
  <span style="left:34%;--s:6px;--t:17s;--d:-8s"></span>
  <span style="left:52%;--s:9px;--t:22s;--d:-1s"></span>
  <span style="left:66%;--s:5px;--t:15s;--d:-11s"></span>
  <span style="left:78%;--s:11px;--t:26s;--d:-6s"></span>
  <span style="left:90%;--s:7px;--t:20s;--d:-16s"></span>
</div>

<main>
  <img class="icon" src="icon.jpg" width="152" height="152" alt="The First Bloom app icon: a glossy cell with DNA inside, floating in the ocean">
  <h1>First Bloom</h1>
  <p class="tagline">An idle evolution game. Start from a few molecules in an empty ocean and grow life, one creature at a time.</p>
  <div class="soon">Coming soon to Android</div>
</main>

<footer>
  <nav>
    <a href="privacy-policy.html">Privacy policy</a>
    <a href="mailto:firstbloomgame@outlook.com">firstbloomgame@outlook.com</a>
  </nav>
  <p>Made by an independent developer.</p>
</footer>
</body>
</html>
